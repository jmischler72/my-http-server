<!DOCTYPE html>
<html>
<head>
 <title>jmischler72 - Personal Website</title>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="/static/style.css">
</head>
<body>
 <div class="main-container">
  <!-- Background ASCII Grid -->
  <div id="ascii-grid" class="ascii-grid background-grid"></div>
  
  <!-- Centered Header Content -->
  <div class="header-overlay" id="headerOverlay">
   <button class="toggle-button" onclick="toggleHeader()" title="Hide/Show Header">×</button>
   <div class="header">
    <div class="profile-section">
     <div class="profile-image-container">
      <img src="/static/images/profile.png" alt="jmischler72 profile picture" class="profile-image">
     </div>
     <div class="profile-info">
      <h1>jmischler72</h1>
     </div>
    </div>
    
    <h2>links</h2>
    <ul class="links">
     <li><a href='https://www.youtube.com/@jmischler72'>youtube</a></li>
     <!-- <li><a href='https://jmischler72.github.io/cv/'>cv</a></li> -->
     <li><a href='https://github.com/jmischler72'>github</a></li>
    </ul>
    <h2>projects</h2>
    <ul class="links projects">
     <li><a href='https://cazvas.fr'>cazvas</a><span class="health-indicator" data-url="https://app.cazvas.fr"></span></li>
     <li><a href='https://modmiinext.joff.sh/'>modmiinext</a><span class="health-indicator" data-url="https://modmiinext.joff.sh/"></span></li>
     <li><a href='https://tetrarena.joff.sh/'>tetrarena</a><span class="health-indicator" data-url="https://tetrarena.joff.sh/"></span></li>
    </ul>
   </div>

  </div>
  
  <!-- Show Header Button (hidden by default) -->
  <button class="show-header-button" id="showHeaderButton" onclick="toggleHeader()" style="display: none;" title="Show Header">i</button>
 </div>
 


 <!-- Modal for grid entry -->
 <div id="entryModal" class="modal">
  <div class="modal-content">
   <h3>Write something</h3>
   <p>Position: <span id="positionText"></span></p>
   <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
   <textarea id="messageInput" placeholder="Your message" maxlength="100" rows="3"></textarea>
   <div>
    <button onclick="submitGridEntry()">Submit</button>
    <button onclick="closeModal()">Cancel</button>
   </div>
  </div>
 </div>

 <div id="tooltip" class="tooltip"></div>

 <script src="/static/script.js"></script>
</body>
</html>
